
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFF Rework</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #101522;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 750px;
  background: #1b2435;
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 10px 35px #0005;
}

h1 {
  text-align: center;
  font-size: 36px;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #aebbd0;
  margin-bottom: 30px;
}

button, select, input {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border-radius: 9px;
  border: none;
  font-size: 16px;
}

select, input {
  background: #303c51;
  color: white;
  border: 1px solid #53627b;
}

button {
  background: #3978ed;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #2863d0;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.secondary {
  background: #39465c;
}

.hidden {
  display: none;
}

.error {
  color: #ff7777;
  text-align: center;
  margin-top: 15px;
}

.section-title {
  margin-top: 28px;
  margin-bottom: 12px;
  padding-bottom: 9px;
  border-bottom: 1px solid #53627b;
  color: #80aaff;
  font-size: 20px;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.stat {
  background: #29364b;
  padding: 14px;
  border-radius: 9px;
  overflow-wrap: anywhere;
  min-width: 0;
}

.stat-name {
  color: #aebbd0;
  font-size: 13px;
  margin-bottom: 7px;
}

.stat-value {
  font-size: 18px;
  font-weight: bold;
}

.footer {
  color: #8493aa;
  text-align: center;
  font-size: 12px;
  margin-top: 25px;
  line-height: 1.7;
}

@media (max-width: 450px) {
  .container {
    padding: 20px;
  }

  h1 {
    font-size: 29px;
  }

  .stats-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <section id="start">
    <h1>IFF Rework</h1>
    <p class="subtitle">Узнайте свою статистику прямо сейчас!</p>
    <button onclick="showLogin()">Начать</button>
  </section>

  <section id="login" class="hidden">
    <h1>Вход в государство</h1>
    <p class="subtitle">Выберите государство и введите свой ключ.</p>

    <select id="country">
      <option value="">Выберите государство</option>
      <option value="Пятигорье">Пятигорье</option>
      <option value="Редия">Редия</option>
      <option value="Колбасоляндия 2х">Колбасодяндия 2х</option>
      <option value="СПМР">СПМР</option>
      <option value="PMC Reduct">RMC Reduct</option>
      <option value="Лос Илюминадос">Лос Илюминадос</option>
      <option value="Королевство Тайлеровское">Королевство Тайлеровское</option>
      <option value="Бургерланд">Бургенланд</option>
    </select>

    <input
      id="key"
      type="password"
      placeholder="Введите ключ государства"
      autocomplete="off"
    >

    <button onclick="login()">Посмотреть статистику</button>
    <button class="secondary" onclick="showStart()">Назад</button>

    <p id="error" class="error"></p>
  </section>

  <section id="statistics" class="hidden">
    <h1 id="countryTitle">Статистика</h1>
    <div id="stats"></div>
    <button onclick="showStart()">Вернуться на стартовую страницу</button>
  </section>

</div>

<script>
const FUNCTION_URL =
  "https://glxirqmkvrxwkanffdbp.supabase.co/functions/v1/swift-function";

// ВСТАВЬ СЮДА СВОЙ ПРЕЖНИЙ ПУБЛИЧНЫЙ КЛЮЧ
const SUPABASE_PUBLIC_KEY = "sb_publishable_anhmXjORmkLEW1MXBVZzXw_NcTXuwfZ";

function showStart() {
  document.getElementById("start").classList.remove("hidden");
  document.getElementById("login").classList.add("hidden");
  document.getElementById("statistics").classList.add("hidden");
  document.getElementById("key").value = "";
  document.getElementById("error").textContent = "";
}

function showLogin() {
  document.getElementById("start").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
}

function showStatistics() {
  document.getElementById("login").classList.add("hidden");
  document.getElementById("statistics").classList.remove("hidden");
}

async function login() {
  const countryName = document.getElementById("country").value;
  const key = document.getElementById("key").value;
  const error = document.getElementById("error");
  const button = document.querySelector("#login button");

  error.textContent = "";

  if (!countryName) {
    error.textContent = "Выберите государство.";
    return;
  }

  if (!key) {
    error.textContent = "Введите ключ государства.";
    return;
  }

  if (
    SUPABASE_PUBLIC_KEY === "ВСТАВЬ_СЮДА_PUBLISHABLE_KEY" ||
    !SUPABASE_PUBLIC_KEY.startsWith("sb_publishable_")
  ) {
    error.textContent = "Сначала необходимо настроить подключение сайта.";
    return;
  }

  button.disabled = true;
  button.textContent = "Загрузка...";

  try {
    const response = await fetch(FUNCTION_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_PUBLIC_KEY
      },
      body: JSON.stringify({
        countryName: countryName,
        key: key
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      error.textContent =
        result.error || "Не удалось получить статистику.";
      return;
    }

    document.getElementById("countryTitle").textContent =
      "Статистика: " + result.country;

    renderStatistics(result.statistics);

    document.getElementById("key").value = "";
    showStatistics();

  } catch (e) {
    error.textContent =
      "Не удалось подключиться к серверу. Попробуйте позже.";
  } finally {
    button.disabled = false;
    button.textContent = "Посмотреть статистику";
  }
}

// Названия показателей
const labels = {
  capital: "Столица",
  ruler: "Президент / правитель",
  cities: "Количество городов",
  population: "Количество населения",
  army: "Армия",
  reserve: "Резерв",

  budget: "Баланс казны (ИФ)",
  dailyIncome: "Доход за игровой день (ИФ)",
  expenses: "Постоянные траты (ИФ)",
  net: "Чистый заработок (ИФ)",
  taxIncome: "Доход от налогов (ИФ)",
  tradeIncome: "Доход от торговли (ИФ)",

  factories: "Заводы",
  agriculture: "Сельское хозяйство — уровень",
  electricity: "Электроснабжение — уровень",
  heating: "Отопление — уровень",
  border: "Укрепление границ — уровень",
  schools: "Школы",
  hospitals: "Больницы",
  shops: "Магазины и другие предприятия",
  fortifications: "Укрепления",
  shelters: "Укрытия",

  satisfaction: "Удовлетворённость населения",
  food: "Обеспеченность продовольствием",
  electricityAccess: "Доступ к электричеству",
  heatingAccess: "Доступ к отоплению",

  bases: "Военные базы",
  groundExpense: "Расходы на наземные войска в день (ИФ)",
  aviationExpense: "Расходы на авиацию в день (ИФ)",
  navyExpense: "Расходы на флот в день (ИФ)"
};

// Порядок отображения показателей
const groups = [
  {
    title: "🏳️ Основная информация",
    keys: [
      "capital", "ruler", "cities", "population",
      "army", "reserve"
    ]
  },
  {
    title: "💰 Экономика",
    keys: [
      "budget", "dailyIncome", "expenses", "net",
      "taxIncome", "tradeIncome"
    ]
  },
  {
    title: "🏙️ Инфраструктура",
    keys: [
      "factories", "agriculture", "electricity",
      "heating", "border", "schools", "hospitals",
      "shops", "fortifications", "shelters"
    ]
  },
  {
    title: "🌱 Благополучие населения",
    keys: [
      "satisfaction", "food",
      "electricityAccess", "heatingAccess"
    ]
  },
  {
    title: "🪖 Военная инфраструктура и расходы",
    keys: [
      "bases", "groundExpense",
      "aviationExpense", "navyExpense"
    ]
  }
];

function addCard(container, name, value) {
  const item = document.createElement("div");
  item.className = "stat";

  const title = document.createElement("div");
  title.className = "stat-name";
  title.textContent = name;

  const val = document.createElement("div");
  val.className = "stat-value";
  val.textContent = String(value);

  item.appendChild(title);
  item.appendChild(val);
  container.appendChild(item);
}

function addSection(container, title, entries) {
  if (!entries.length) return;

  const heading = document.createElement("h3");
  heading.className = "section-title";
  heading.textContent = title;
  container.appendChild(heading);

  const grid = document.createElement("div");
  grid.className = "stats-grid";

  entries.forEach(([name, value]) => {
    addCard(grid, name, value);
  });

  container.appendChild(grid);
}

function renderStatistics(data) {
  const container = document.getElementById("stats");
  container.replaceChildren();

  if (!data || typeof data !== "object") {
    container.textContent = "Статистика пока недоступна.";
    return;
  }

  const displayed = new Set();

  // Основные показатели из Supabase
  groups.forEach(group => {
    const entries = [];

    group.keys.forEach(key => {
      if (
        Object.prototype.hasOwnProperty.call(data, key) &&
        data[key] !== null &&
        data[key] !== undefined
      ) {
        entries.push([labels[key], data[key]]);
        displayed.add(key);
      }
    });

    addSection(container, group.title, entries);
  });

  // Дополнительные показатели торговли
  addSection(container, "📦 Торговля и вооружение", [
    ["Импорт за игровой день", "0 ИФ"],
    ["Экспорт за игровой день", "0 ИФ"],
    ["Баллистические ракеты", "0"],
    ["Ядерные бомбы", "0"]
  ]);

  // Наземные войска
  addSection(container, "🪖 Наземные войска", [
    [
      "Пехота — уровень 1",
      data.country === "PMC Reduct" ? "Да" : "Нет"
    ],
    ["Пехота — уровень 2", "Нет"],
    ["Пехота — уровень 3", "Нет"],
    ["Танки — уровни 1–3", "Нет"],
    ["Противотанковые подразделения — уровни 1–3", "Нет"]
  ]);

  // Авиация
  addSection(container, "✈️ Авиация", [
    ["Транспортные самолёты", "0"],
    ["Грузовые самолёты", "0"],
    ["Боевые самолёты — уровень 1", "Нет"],
    ["Истребители — уровень 2", "Нет"],
    ["Бомбардировщики — уровень 3", "Нет"],
    ["Аэропорты", "0"]
  ]);

  // Флот
  const hasShips =
    document.getElementById("country").value === "СПМР" ||
    document.getElementById("country").value === "PMC Reduct";

  addSection(container, "🚢 Флот", [
    ["Транспортные корабли", hasShips ? "1" : "0"],
    ["Грузовые корабли", "0"],
    ["Патрульные лодки — уровень 1", "Нет"],
    ["Эсминцы — уровень 2", "Нет"],
    ["Авианосцы — уровень 3", "Нет"],
    ["Порты", hasShips ? "1" : "0"]
  ]);

  // Неизвестные дополнительные поля не теряем
  const remaining = Object.entries(data).filter(([key, value]) => {
    return (
      !displayed.has(key) &&
      value !== null &&
      value !== undefined &&
      typeof value !== "object"
    );
  });

  if (remaining.length) {
    addSection(
      container,
      "📊 Дополнительные показатели",
      remaining.map(([key, value]) => [
        labels[key] || key.replace(/([A-Z])/g, " $1"),
        value
      ])
    );
  }

  const footer = document.createElement("div");
  footer.className = "footer";
  footer.textContent =
    "Следующий расчёт экономики: каждые 24 часа. | IFF Rework";

  container.appendChild(footer);
}
</script>

</body>
</html>
